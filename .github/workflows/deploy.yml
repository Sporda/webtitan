name: Deploy webu na webtitan.cz

# Web je statický (Astro ve složce web/ → čisté HTML ve web/dist/) + pár PHP endpointů (web/public/api).
# Běží na hostingu v panelu (panel.webtitan.cz), žádný Docker – workflow web sestaví, zkopíruje web/dist/ na server
# a ověří, že web odpovídá. Když build selže, nenasadí se nic.
#
# Dvě úlohy na oddělených strojích: „build“ instaluje balíčky z npm (spouští cizí instalační skripty) a nemá
# přístup k žádnému tajemství; „deploy“ dostane jen hotový web/dist/ a npm vůbec nespouští – SSH klíč k serveru
# tak nikdy neleží na stroji, kde běžel kód z npm.
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-webtitan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Zkontrolovat typy a sestavit web (Astro)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/

      - name: Připravit SSH klíč a otisk serveru
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Otisk klíče serveru webtitan.cz – připojení k jinému (podvrženému) serveru selže.
          echo '* ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGAULs93rZBiQ8SVfUe4QiQVLWD24UW9b/uTKjvn+NAT' > ~/.ssh/known_hosts_deploy

      - name: Nasadit web
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USERNAME }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          DEPLOY_KEY="$HOME/.ssh/deploy_key" \
          DEPLOY_KNOWN_HOSTS="$HOME/.ssh/known_hosts_deploy" \
          bash scripts/deploy.sh

      - name: Uklidit klíč
        if: always()
        run: rm -f ~/.ssh/deploy_key
