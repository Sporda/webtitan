name: Deploy návrhů na webtitan.cz

# Web běží na hostingu v panelu (panel.webtitan.cz) bez Dockeru.
# Zatím se nasazují jen návrhy: designs.html, design<N>.html, design-assets/ a api/likes.php.
on:
  push:
    branches:
      - main
    paths:
      - "public/designs.html"
      - "public/design[0-9]*.html"
      - "public/design-assets/**"
      - "public/api/likes.php"
      - "scripts/deploy-designs.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-designs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Připravit SSH klíč a otisk serveru
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Otisk klíče serveru webtitan.cz – připojení k jinému (podvrženému) serveru selže.
          echo '* ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGAULs93rZBiQ8SVfUe4QiQVLWD24UW9b/uTKjvn+NAT' > ~/.ssh/known_hosts_deploy

      - name: Nasadit návrhy
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USERNAME }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          DEPLOY_KEY="$HOME/.ssh/deploy_key" \
          DEPLOY_KNOWN_HOSTS="$HOME/.ssh/known_hosts_deploy" \
          bash scripts/deploy-designs.sh

      - name: Uklidit klíč
        if: always()
        run: rm -f ~/.ssh/deploy_key
